[workspace]
resolver = "2"
members = [
    "crates/tufazip-arith",
    "crates/tufazip-preprocess",
    "crates/tufazip-prior",
    "crates/tufazip-codec",
    "crates/tufazip-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
authors = ["Brandon Hubbard <brandon@brandonhubbard.com>"]
repository = "https://github.com/bhubbard/tufazip-rs"

[workspace.dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4", features = ["derive"] }
half = "2.5"
hex = "0.4"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.4"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
