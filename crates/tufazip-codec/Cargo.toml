[package]
name = "tufazip-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://code.brandonhubbard.com/tufazip-rs/api/tufazip_codec/"
description = "Neural Transformer arithmetic codec, online Adam trainer, prefix replay, and checkpointing for tufazip"

[features]
default = []
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
hex.workspace = true
rand.workspace = true
rand_chacha.workspace = true
rand_distr.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tufazip-arith = { version = "0.2.0", path = "../tufazip-arith" }
tufazip-prior = { version = "0.2.0", path = "../tufazip-prior" }

[dev-dependencies]
tempfile.workspace = true
tufazip-preprocess = { path = "../tufazip-preprocess" }

[lints]
workspace = true
