[package]
name = "tufazip-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://code.brandonhubbard.com/tufazip-rs/api/tufazip/"
description = "Command-line interface for tufazip pure-Rust neural lossless compression and decompression"

[[bin]]
name = "tufazip"
path = "src/main.rs"

[features]
default = []
accelerate = ["tufazip-codec/accelerate"]
metal = ["tufazip-codec/metal"]
cuda = ["tufazip-codec/cuda"]
mkl = ["tufazip-codec/mkl"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tufazip-arith = { version = "0.2.0", path = "../tufazip-arith" }
tufazip-codec = { version = "0.2.0", path = "../tufazip-codec" }
tufazip-preprocess = { version = "0.2.0", path = "../tufazip-preprocess" }
tufazip-prior = { version = "0.2.0", path = "../tufazip-prior" }

[dev-dependencies]
candle-core.workspace = true
hex.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
sha2.workspace = true

[lints]
workspace = true
